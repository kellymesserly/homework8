Html<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contact Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, textarea {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 300px;
        }
        .error {
            background-color: #ffcccc; /* Light red background */
        }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <form id="contactForm" onsubmit="return checkboxes()">
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="Name">

        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email">

        <label for="Message">Message:</label>
        <textarea id="Message" name="Message"></textarea>

        <button type="submit">Submit</button>
    </form>

    <script>
        function checkboxes() {
            let fields = [
                document.getElementById("Name"),
                document.getElementById("Email"),
                document.getElementById("Message")
            ];

            // Reset all field styles
            fields.forEach(field => field.classList.remove("error"));

            // Find first empty field
            for (let field of fields) {
                if (field.value.trim() === "") {
                    field.classList.add("error"); // Turn red
                    field.focus(); // Put focus on it
                    window.alert("Please fill out this field.");
                    return false; // Stop form submission
                }
            }

            return true; // All fields filled
        }
    </script>
    <a href="Secondpage.html">Go to the second page</a>
        <a href="Homepage.html">Go to my homepage</a>
</body>
</html>
